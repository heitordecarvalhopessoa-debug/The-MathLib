<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoShape - Gerador de Polígonos</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/png" href="assets/Icon.png">
</head>
<body>
    <div class="container">
        <header>
            <h1>GeoShape</h1>
            <p>Laboratório de Geometria Interativa</p>
        </header>

        <main class="geo-layout">
            <aside class="sidebar-controls">
                <section class="control-section" id="regular-controls">
                    <h3>Geometria</h3>
                    <div class="control-group">
                        <label><input type="checkbox" id="freeMode"> <strong>Modo Desenho Livre</strong></label>
                    </div>
                    <hr>
                    <div class="control-group">
                        <label>Vértices: <span id="v-count">3</span></label>
                        <input type="range" id="vertices" min="0" max="50" value="3">
                    </div>
                    <div class="control-group">
                        <label>Raio: <span id="r-val">150</span>px</label>
                        <input type="range" id="radius" min="50" max="190" value="150">
                    </div>
                    <div class="control-group">
                        <label>Rotação: <span id="rot-val">0</span>°</label>
                        <input type="range" id="rotation" min="0" max="360" value="0">
                    </div>
                </section>

                <section class="control-section">
                    <h3>Estilo e Cor</h3>
                    <div class="color-grid">
                        <input type="color" id="strokeColor" value="#4a90e2" title="Cor da Borda">
                        <input type="color" id="fillColor" value="#4a90e2" title="Cor do Preenchimento">
                    </div>
                    <div class="control-group">
                        <label>Borda: <span id="w-val">3</span>px</label>
                        <input type="range" id="strokeWidth" min="1" max="10" value="3">
                    </div>
                    <div class="control-group">
                        <label>Opacidade: <span id="op-val">0.2</span></label>
                        <input type="range" id="opacity" min="0" max="1" step="0.1" value="0.2">
                    </div>
                </section>

                <section class="control-section">
                    <h3>Visibilidade</h3>
                    <div class="toggle-grid">
                        <label><input type="checkbox" id="showFill" checked> Preencher</label>
                        <label><input type="checkbox" id="showPoints" checked> Pontos</label>
                        <label><input type="checkbox" id="showRadial"> Radiais</label>
                        <label><input type="checkbox" id="showStar"> Estrela</label>
                        <label><input type="checkbox" id="showCircum"> Circunscrito</label>
                        <label><input type="checkbox" id="showIncircle"> Inscrito</label>
                        <label><input type="checkbox" id="showApothem"> Apótema</label>
                        <label><input type="checkbox" id="showExternal"> Externos</label>
                        <label><input type="checkbox" id="showInternal" checked> Internos</label>
                        <label><input type="checkbox" id="showGrid" checked> Grade</label>
                        <label><input type="checkbox" id="snapGrid"> Snap Grid</label>
                        <label><input type="checkbox" id="showCentroid"> Centróide</label>
                    </div>
                </section>

                <div class="actions">
                    <button onclick="clearCanvas()" class="btn-secondary" style="background: #ff6b6b; color: white;">Limpar Tudo</button>
                    <button onclick="exportPNG()" class="btn-action">Exportar PNG</button>
                    <button onclick="resetDefaults()" class="btn-secondary">Resetar</button>
                </div>
            </aside>

            <div class="display-area">
                <div class="stats-grid">
                    <div class="stat-box"><h4>Vértices</h4><p id="stat-v">0</p></div>
                    <div class="stat-box"><h4>Ângulo Médio</h4><p><span id="angle-val">0</span>°</p></div>
                    <div class="stat-box"><h4>Ângulo Externo</h4><p><span id="ext-angle-val">0</span>°</p></div>
                    <div class="stat-box"><h4>Lado (s)</h4><p><span id="side-len">0</span> px</p></div>
                    <div class="stat-box"><h4>Perímetro</h4><p><span id="perimeter">0</span> px</p></div>
                    <div class="stat-box"><h4>Área</h4><p><span id="area">0</span> px²</p></div>
                    <div class="stat-box"><h4>Classificação</h4><p id="triangle-type">-</p></div>
                </div>
                
                <div class="hud-helper">Modo Livre: Clique p/ adicionar. Segure <b>Ctrl</b> + Clique p/ mover pontos.</div>
                
                <div class="canvas-container">
                    <canvas id="shapeCanvas" width="400" height="400"></canvas>
                </div>
            </div>
        </main>
        
        <footer>
            <a href="../../index.html" class="back-link">Voltar ao Portal</a>
        </footer>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
