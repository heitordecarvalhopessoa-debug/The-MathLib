<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoxTable</title>
    <link rel="icon" type="image/png" href="assets/Icon.png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>


    <style>
        :root {
            --bg: #0d0f14;
            --panel: #151922;
            --panel2: #1b2130;
            --accent: #5b8cff;
            --text: #e6e9ef;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI';
            background: var(--bg);
            color: var(--text);
        }

        #topbar {
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 0 22px;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.96), rgba(15, 23, 42, 0.86));
            border-bottom: 1px solid rgba(148, 163, 184, 0.16);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.18);
        }

        #topbar div {
            font-weight: 700;
            letter-spacing: 0.02em;
            color: #f8fafc;
        }

        #topbar input {
            flex: 1;
            max-width: 280px;
            padding: 10px 14px;
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.9);
            color: #e2e8f0;
            outline: none;
        }

        #topbar input::placeholder {
            color: #94a3b8;
        }

        #hud {
            display: grid;
            grid-template-columns: 250px minmax(0, 1fr) 280px;
            gap: 18px;
            padding: 18px;
            min-height: calc(100vh - 56px);
        }

        #sidebar,
        #properties {
            background: rgba(15, 23, 42, 0.88);
            border: 1px solid rgba(148, 163, 184, 0.14);
            border-radius: 24px;
            padding: 18px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.14);
            overflow: auto;
            backdrop-filter: blur(10px);
        }

        #workspace {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 10px;
        }

        canvas {
            width: 100% !important;
            height: calc(100vh - 190px) !important;
            max-height: 100%;
            background: #ffffff;
            border-radius: 24px;
            border: 1px solid rgba(15, 23, 42, 0.08);
            box-shadow: 0 35px 90px rgba(15, 23, 42, 0.12);
        }

        #grafico-titulo {
            position: absolute;
            top: 22px;
            left: 28px;
            font-size: 1.15rem;
            font-weight: 700;
            color: #f8fafc;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
        }

        #tree-workspace {
            width: 100%;
            height: calc(100vh - 190px);
            background: rgba(15, 23, 42, 0.95);
            border-radius: 24px;
            padding: 20px;
            overflow: auto;
            display: none;
            flex-direction: column;
            align-items: flex-start;
        }

        .tree-node {
            display: flex;
            align-items: flex-start;
            position: relative;
            margin: 12px 0;
        }

        .node-content {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(15, 23, 42, 0.95);
            padding: 14px;
            border-radius: 18px;
            border: 1px solid rgba(148, 163, 184, 0.12);
            min-width: 160px;
            z-index: 2;
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.15);
        }

        .node-inputs {
            display: flex;
            gap: 8px;
        }

        .node-result {
            font-size: 0.92rem;
            color: var(--accent);
            font-weight: 700;
            margin-top: 2px;
        }

        .children-container {
            display: flex;
            flex-direction: column;
            padding-left: 36px;
            position: relative;
        }

        .children-container::before {
            content: "";
            position: absolute;
            left: 0;
            top: 24px;
            bottom: 24px;
            width: 2px;
            background: linear-gradient(180deg, rgba(91, 140, 255, 0.9), rgba(91, 140, 255, 0.2));
        }

        .tree-node input,
        input,
        select {
            width: 100%;
            padding: 10px 12px;
            margin: 6px 0;
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 14px;
            background: rgba(15, 23, 42, 0.82);
            color: #e2e8f0;
            outline: none;
            transition: border-color 0.2s ease, transform 0.2s ease;
        }

        .tree-node input:focus,
        input:focus,
        select:focus {
            border-color: rgba(56, 189, 248, 0.72);
            transform: translateY(-1px);
        }

        button {
            width: 100%;
            padding: 12px 14px;
            margin-top: 8px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--accent), #3b82f6);
            color: #0f172a;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.18s ease, filter 0.18s ease, box-shadow 0.18s ease;
            box-shadow: 0 14px 30px rgba(56, 189, 248, 0.12);
        }

        button:hover {
            filter: brightness(1.05);
            transform: translateY(-1px);
        }

        .btn-small {
            width: auto;
            padding: 8px 12px;
            margin: 0;
            border-radius: 12px;
            font-size: 0.95rem;
        }

        .grafico-item {
            padding: 12px 14px;
            margin: 8px 0;
            background: rgba(15, 23, 42, 0.9);
            border-radius: 16px;
            border: 1px solid rgba(148, 163, 184, 0.1);
            cursor: pointer;
            transition: transform 0.18s ease, border-color 0.18s ease;
        }

        .grafico-item:hover {
            transform: translateX(2px);
            border-color: rgba(56, 189, 248, 0.5);
        }

        .grafico-item.ativo {
            outline: 2px solid rgba(56, 189, 248, 0.95);
            background: rgba(56, 189, 248, 0.08);
        }

        #toast {
            position: fixed;
            bottom: 15px;
            right: 15px;
            background: #222;
            padding: 10px;
            border-radius: 5px;
            opacity: 0;
            transition: .3s;
        }
    </style>
</head>

<body>

    <div id="topbar">
        <div>Foxtable</div>
        <input id="busca" placeholder="Buscar...">
    </div>

    <div id="hud">

        <div id="sidebar">
            <button onclick="novoGrafico()">+ Novo</button>
            <button onclick="novaArvore()" style="background: var(--accent); margin-top: 10px;">+ Nova Árvore</button>
            <div id="lista"></div>
        </div>

        <div id="workspace">
            <div id="grafico-titulo"></div>
            <canvas id="grafico"></canvas>
            <div id="tree-workspace"></div>
        </div>

        <div id="properties">
            <h3>Propriedades</h3>

            <input id="titulo" placeholder="Título">
            <select id="tipo">
                <option value="bar">Barra</option>
                <option value="line">Linha</option>
                <option value="pie">Pizza</option>
                <option value="doughnut">Doughnut</option>
                <option value="radar">Radar</option>
                <option value="polarArea">Área Polar</option>
                <option value="bubble">Bolhas</option>
            </select>

            <input id="dados" placeholder="10,20,30">
            <input id="labels" placeholder="A,B,C">

            <select id="paleta">
                <option value="vibrante">Vibrante</option>
                <option value="pastel">Pastel</option>
                <option value="neon">Neon</option>
                <option value="sunset">Sunset</option>
                <option value="ocean">Ocean</option>
                <option value="fire">Fire</option>
                <option value="random">Aleatório</option>
            </select>

            <button onclick="atualizarGrafico()">Salvar</button>
            <button onclick="duplicarGrafico()">Duplicar</button>
            <button onclick="limparGrafico()">Limpar</button>
            <button onclick="excluirGrafico()">Excluir</button>

            <hr>

            <button onclick="exportarPNG()">Exportar PNG</button>
            <button onclick="exportarJSON()">Exportar Projeto</button>
            <input type="file" onchange="importarJSON(event)">
        </div>

    </div>

    <div id="toast"></div>

    <script>
        let chart;
        let graficos = [];
        let selecionado = null;

        const $ = id => document.getElementById(id);

        function toast(msg) {
            const t = $("toast");
            t.innerText = msg;
            t.style.opacity = 1;
            setTimeout(() => t.style.opacity = 0, 2000);
        }

        function gerarCores(qtd, tipo) {
            const p = {
                vibrante: ["#ff595e", "#ffca3a", "#8ac926", "#1982c4", "#6a4c93"],
                pastel: ["#ffd6e0", "#caffbf", "#9bf6ff", "#bdb2ff", "#ffc6ff"],
                neon: ["#00f5d4", "#ff00ff", "#39ff14", "#ffea00", "#00bbf9"],
                sunset: ["#ff7b00", "#ff006e", "#8338ec", "#3a86ff"],
                ocean: ["#003f5c", "#2f4b7c", "#665191", "#a05195", "#d45087"],
                fire: ["#ff0000", "#ff5400", "#ffbd00", "#ffea00"],
                random: Array.from({ length: qtd }, () => `hsl(${Math.random() * 360},70%,60%)`)
            };
            const base = p[tipo] || p.vibrante;
            return Array.from({ length: qtd }, (_, i) => base[i % base.length]);
        }

        function novoGrafico() {
            const g = {
                id: Date.now(),
                titulo: "Novo gráfico",
                tipo: "bar",
                dados: [10, 20, 30],
                labels: ["A", "B", "C"],
                paleta: "vibrante"
            };
            graficos.push(g);
            selecionar(g.id);
            atualizarLista();
        }

        function novaArvore() {
            const g = {
                id: Date.now(),
                titulo: "Nova Árvore",
                tipo: "tree",
                root: { id: Date.now() + 1, label: "Início", prob: 1, children: [] },
                paleta: "vibrante"
            };
            graficos.push(g);
            selecionar(g.id);
            atualizarLista();
            salvar();
        }

        function selecionar(id) {
            selecionado = id;
            const g = graficos.find(x => x.id === id);
            if (!g) return;

            $("titulo").value = g.titulo;
            $("tipo").value = g.tipo;

            if (g.tipo !== "tree") {
                $("dados").value = g.dados ? g.dados.join(",") : "";
                $("labels").value = g.labels ? g.labels.join(",") : "";
                $("paleta").value = g.paleta || "vibrante";
            }

            desenhar(g);
            atualizarLista();
        }

        function desenhar(g) {
            const isTree = g.tipo === "tree";
            $("grafico").style.display = isTree ? "none" : "block";
            $("tree-workspace").style.display = isTree ? "flex" : "none";

            // Esconde campos irrelevantes para árvore no painel lateral
            $("tipo").style.display = isTree ? "none" : "block";
            $("dados").style.display = isTree ? "none" : "block";
            $("labels").style.display = isTree ? "none" : "block";
            $("paleta").style.display = isTree ? "none" : "block";

            if (isTree) {
                renderizarArvore(g);
            } else {
                desenharGrafico(g);
            }
            $("grafico-titulo").innerText = g.titulo;
        }

        function desenharGrafico(g) {
            const ctx = $("grafico").getContext("2d");

            if (!chart) {
                chart = new Chart(ctx, { type: g.tipo, data: {}, options: {} });
            }

            const cores = gerarCores(g.dados.length, g.paleta);

            chart.config.type = g.tipo;

            // Ajuste de dados para gráfico de Bolhas (Bubble)
            const processarDados = g.tipo === 'bubble'
                ? g.dados.map((v, i) => ({ x: i + 1, y: v, r: v / 2 }))
                : g.dados;

            chart.data = {
                labels: g.labels,
                datasets: [{
                    label: g.titulo,
                    data: processarDados,
                    backgroundColor: cores,
                    borderColor: "#111",
                    borderWidth: 2,
                    borderRadius: 8,
                    tension: 0.35,
                    fill: g.tipo === "line"
                }]
            };

            chart.options = {
                responsive: true,
                animation: { duration: 800 },
                plugins: {
                    legend: { labels: { color: "#ddd" } },
                    tooltip: { backgroundColor: "#111" }
                },
                scales: (["pie", "doughnut", "polarArea"].includes(g.tipo)) ? {} :
                    (g.tipo === "radar" ? { r: { ticks: { display: false } } } : {
                        x: { ticks: { color: "#aaa" } },
                        y: { ticks: { color: "#aaa" } }
                    })
            };

            chart.update();
        }

        function renderizarArvore(g) {
            const container = $("tree-workspace");
            container.innerHTML = "";
            if (g.root) {
                container.appendChild(criarNodeHTML(g.root, g, 1));
            } else {
                container.innerHTML = "<p style='color:gray; padding:20px;'>Estrutura de árvore não encontrada.</p>";
            }
        }

        function criarNodeHTML(node, g, probAcumulada) {
            const div = document.createElement("div");
            div.className = "tree-node";

            const pAtual = (probAcumulada * (node.prob || 0)).toFixed(3);

            const content = document.createElement("div");
            content.className = "node-content";
            content.innerHTML = `
        <div class="node-inputs">
            <input style="width:80px" value="${node.label}" onchange="nodeUpdate('${g.id}', '${node.id}', 'label', this.value)" placeholder="Evento">
            <input style="width:50px" type="number" step="0.01" value="${node.prob}" onchange="nodeUpdate('${g.id}', '${node.id}', 'prob', this.value)" placeholder="P">
        </div>
        <div class="node-result">P(acum): ${pAtual}</div>
        <div style="display:flex; gap:4px; margin-top:5px;">
            <button class="btn-small" onclick="addBranch('${g.id}', '${node.id}')">+</button>
            ${node.id !== g.root.id ? `<button class="btn-small" style="background:#ff595e" onclick="removeBranch('${g.id}', '${node.id}')">x</button>` : ''}
        </div>
    `;

            div.appendChild(content);

            if (node.children && node.children.length > 0) {
                const childrenCont = document.createElement("div");
                childrenCont.className = "children-container";
                node.children.forEach(child => {
                    childrenCont.appendChild(criarNodeHTML(child, g, parseFloat(pAtual)));
                });
                div.appendChild(childrenCont);
            }

            return div;
        }

        function findNode(node, id) {
            if (node.id == id) return node;
            for (let child of node.children) {
                let found = findNode(child, id);
                if (found) return found;
            }
            return null;
        }

        function addBranch(gId, nodeId) {
            const g = graficos.find(x => x.id == gId);
            const node = findNode(g.root, nodeId);
            node.children.push({ id: Date.now(), label: "Nova Opção", prob: 0.5, children: [] });
            desenhar(g);
            salvar();
        }

        function removeBranch(gId, nodeId) {
            const g = graficos.find(x => x.id == gId);
            const removerDe = (parent) => {
                parent.children = parent.children.filter(c => c.id != nodeId);
                parent.children.forEach(removerDe);
            };
            removerDe(g.root);
            desenhar(g);
            salvar();
        }

        function nodeUpdate(gId, nodeId, key, val) {
            const g = graficos.find(x => x.id == gId);
            const node = findNode(g.root, nodeId);
            node[key] = key === 'prob' ? parseFloat(val) : val;
            renderizarArvore(g);
            salvar();
        }

        function atualizarGrafico() {
            if (!selecionado) return;
            const g = graficos.find(x => x.id === selecionado);
            if (!g) return;

            g.titulo = $("titulo").value;

            if (g.tipo !== "tree") {
                g.tipo = $("tipo").value;
                g.dados = $("dados").value.split(',').map(Number);
                g.labels = $("labels").value.split(',');
                g.paleta = $("paleta").value;
            }

            desenhar(g);
            atualizarLista();
            salvar();
        }

        function duplicarGrafico() {
            const g = graficos.find(x => x.id === selecionado);
            const c = { ...g, id: Date.now(), titulo: g.titulo + " copia" };
            graficos.push(c);
            selecionar(c.id);
        }

        function excluirGrafico() {
            graficos = graficos.filter(g => g.id !== selecionado);
            selecionado = null;
            if (chart) { chart.destroy(); chart = null; }
            atualizarLista();
        }

        function limparGrafico() {
            const g = graficos.find(x => x.id === selecionado);
            g.dados = [];
            g.labels = [];
            desenhar(g);
        }

        function atualizarLista() {
            lista.innerHTML = "";
            graficos.forEach(g => {
                const d = document.createElement("div");
                d.className = "grafico-item" + (g.id === selecionado ? " ativo" : "");
                d.innerText = g.titulo;
                d.onclick = () => selecionar(g.id);
                lista.appendChild(d);
            });
        }

        async function exportarPNG() {
            if (!selecionado) return;
            const g = graficos.find(x => x.id === selecionado);
            const link = document.createElement("a");
            link.download = `${g.titulo}.png`;

            if (g.tipo === "tree") {
                const workspace = $("tree-workspace");
                // Captura a área da árvore e converte para canvas
                const canvas = await html2canvas(workspace, {
                    backgroundColor: "#0d0f14", // Cor de fundo do workspace
                    scale: 2, // Aumenta a resolução do print
                    logging: false
                });
                link.href = canvas.toDataURL("image/png");
            } else {
                if (!chart) return;
                link.href = chart.toBase64Image();
            }
            link.click();
        }

        function exportarJSON() {
            const blob = new Blob([JSON.stringify(graficos)], { type: "application/json" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "projeto.json";
            a.click();
        }

        function importarJSON(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = evt => {
                graficos = JSON.parse(evt.target.result);
                atualizarLista();
                if (graficos.length) selecionar(graficos[0].id);
            };
            reader.readAsText(file);
        }

        function salvar() {
            localStorage.setItem("fox", JSON.stringify(graficos));
        }

        function carregar() {
            const d = localStorage.getItem("fox");
            if (d) {
                graficos = JSON.parse(d);
                if (graficos.length) selecionar(graficos[0].id);
            }
        }

        $("dados").oninput = $("labels").oninput = () => { if (selecionado) atualizarGrafico(); }

        carregar();
    </script>

</body>

</html>
